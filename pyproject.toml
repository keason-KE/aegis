[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-gateway"
version = "1.0.0"
description = "Agent authorization gateway with persistent identities and JWT authentication"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.122,<1", "uvicorn>=0.30,<1", "PyJWT[crypto]>=2.10,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.setuptools.package-data]
aegis = ["static/*"]
